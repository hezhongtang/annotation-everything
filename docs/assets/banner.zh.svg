<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
<title id="title">annotation-everything</title>
<desc id="description">批注改稿与逐轮分析，在同一份材料里保留修改意见、问题、假设与结论。</desc>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<rect x="0" y="0" width="1440" height="480" rx="0" fill="#faf9f5" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1440" height="7" rx="0" fill="#243a50" stroke="none" stroke-width="1"/>
<text x="64" y="68" font-size="29" fill="#253b50" font-weight="700" >annotation-everything</text>
<text x="64" y="166" font-size="55" fill="#172c3b" font-weight="700" >批注，让修改到位。</text>
<text x="64" y="245" font-size="55" fill="#172c3b" font-weight="700" >分析，让问题想透。</text>
<path d="M66 181 Q286 189 504 181" fill="none" stroke="#dd573f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M66 260 Q270 268 508 260" fill="none" stroke="#326bb6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="310" font-size="21" fill="#53606a" font-weight="500" >对照报告与讲稿，逐轮问答，确认后交给 Agent。</text>
<text x="64" y="402" font-size="18" fill="#35434e" font-weight="600" >版本 0.12.0</text>
<text x="64" y="435" font-size="18" fill="#596773" font-weight="500" >本机审阅，修改与推理都有记录</text>
<text x="814" y="78" font-size="21" fill="#bc4937" font-weight="600" >批注改稿</text>
<text x="1190" y="78" font-size="21" fill="#285e9c" font-weight="600" >分析问题</text>
