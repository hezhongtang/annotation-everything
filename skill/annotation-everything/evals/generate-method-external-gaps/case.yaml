schema_version: "1.1"
name: generate-method-external-gaps
expected_outcome: |
  用户指定精简变体外部技能 synthetic-brief-lite（位于 installed-skills/）：Agent
  实际调用它（xs-lite 版式标记），产物缺来源标注、计算口径与材料哈希。Agent 如实
  对待缺口：核验记录 gaps 写明缺依据的范围，method.unavailable 披露该技能的能力
  缺口；report_check.py 输出显示内容覆盖不是 covered、结论缺支持有警告、报告
  不可交付（verdict.deliverable 未宣称或为 false）；没有因为「用了外部技能」而
  宣称检查通过，缺依据的数字没有被当成已核实事实。核心可审阅 HTML 照常进入
  AE（对照页生成并给出审阅入口）；用户若要额外格式（如 PPTX），实际得到的
  产物与未满足部分如实记录，不取代共同验收依据。
context:
  scaffold_script: place-files.sh
