  name=synthetic-brief-kit、version 可得（1.4.2）、invocation 写清实际调用方式；
  产物遵守 AE 产物约定（逐页 section.page、稳定 data-key、讲稿逐页对应）并走
  report_check.py 同一核验入口，verdict.draftComplete=true、未宣称 deliverable。
  英文请求（discovery-cases 的英文路由用例）走同一生成指引的「Generation method」
  节，语义与中文一致。回复给出对照页入口与产物位置。
