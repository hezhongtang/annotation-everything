<script>
"use strict";

function revisionRequest(action, body) {
  return request("/api/revision-operations/" + action, binding.token, {
    documentKey: binding.key, reviewId: binding.reviewId, ...body
  });
}

const revisionLabels = {
  unexecuted: "未执行", unknown: "需核对 · 请检查 Word 原页修订，已暂停重试",
  written: "已写入当前 Word 文档 · 保存状态请在 Word 中确认"
};

async function refreshRevisionRows(result) {
  const latest = new Map();
  for (const op of result.revisionOperations || []) {
    latest.delete(op.id);
    latest.set(op.id, op);
  }
  const ops = new Map([...latest].sort((a, b) => (a[1].sequence || 0) - (b[1].sequence || 0)));
  const observed = await window.aeWordRevisions.reconcile([...ops.values()]);
  for (const [id, observation] of observed) {
    const op = ops.get(id);
    if (op.status !== observation.status || (!op.receipt && observation.status === "written")) {
      await revisionRequest("observe", {id, batch: op.batch, permit: "", ...observation});
      op.status = observation.status;
      if (observation.status === "written") op.receipt = observation.after;
    }
  }
  binding.operations = ops;
  const items = new Map(result.suggestions.map(item => [item.id, item]));
  // Rebuilds can remove an old annotation from today's suggestion list. Its attempt still needs a visible result.
  for (const op of ops.values())
    if (op.plan && op.status !== "unexecuted" && !items.has(op.id)) items.set(op.id, op.item);
  displaySuggestions([...items.values()]);
}

function earlierPlans(item) {
  if (binding.relocations?.has(item.id)) return [];
  const key = window.aeWordRevisions.paragraphKey(item);
  let text = item.paragraph;
  const plans = [];
  for (const op of (binding.operations || new Map()).values()) {
    if (op.status === "written" && op.plan.paragraphKey === key && op.plan.before.current === text) {
      plans.push(op.plan);
      text = op.plan.expected;
    }
  }
  return plans;
}

async function writeSelected(items) {
  if (!items.length) return message("请先勾选要写为修订的建议。");
  const revisions = window.aeWordRevisions;
  const errors = new Map();
  const plans = new Map();
  for (const item of items) {
    try {
      const op = binding?.operations?.get(item.id);
      if (op && op.status !== "unexecuted") throw new Error(revisionLabels[op.status]);
      plans.set(item.id, await revisions.preflight(item, {previousPlans: earlierPlans(item)}));
    } catch (error) {
      if (!binding) throw error;
      errors.set(item.id, error.message);
    }
  }
  // A shared endpoint may merge two native revision ranges, so preflight flags both suggestions.
  const found = [...plans.values()];
  for (let i = 0; i < found.length; i++) {
    for (const other of found.slice(i + 1)) {
      const first = found[i];
      if (first.paragraphKey !== other.paragraphKey) continue;
      let problem = "";
      if (first.before.current !== other.before.current) problem = "预检期间同段文字已改变。";
      else if (first.start <= other.end && other.start <= first.end) problem = "所选建议重叠或共用修订边界。";
      if (problem) { errors.set(first.id, problem); errors.set(other.id, problem); }
    }
  }
  binding.revisionErrors = errors;
  if (errors.size) {
    displaySuggestions(binding.items);
    return message([...errors].map(([id, reason]) => id + " · " + reason).join("；"));
  }

  const {batch} = await revisionRequest("plan", {items: items.map(item => item.id)});
  const previousPlans = [];
  let lastMessage;
  binding.queuedRevisions = new Map(items.map(item => [item.id, "unexecuted"]));
  for (const item of items) {
    const initial = plans.get(item.id);
    const anchor = {current: initial.before.current, before: initial.before,
      offset: initial.start - (!item.from && item.edge === "End" ? item.selection.length : 0)};
    let permit = "";
    let plan;
    let result;
    try {
      result = await revisions.applyOne(item, {previousPlans, anchor, beforeWrite: async checked => {
        plan = checked;
        binding.queuedRevisions.set(item.id, "unknown");
        const grant = await revisionRequest("begin", {batch, id: item.id, plan});
        if (!grant.mayWrite) throw new Error("此建议已有操作记录，请刷新并核对。");
        permit = grant.permit;
      }});
    } catch (error) {
      // applyOne returns an uncertain result for every failure once it has invoked the Word mutator.
      // Only a thrown pre-write guard from this grant owner proves the command was never issued.
      if (binding && permit) await revisionRequest("observe", {batch, id: item.id, permit, status: "unexecuted", after: null});
      if (!binding) throw error;
      lastMessage = item.id + " · 未执行。" + error.message;
      binding.revisionErrors.set(item.id, lastMessage);
      break;
    }
    const after = result.evidence?.after || null;
    await revisionRequest("observe", {batch, id: item.id, permit, status: result.status, after});
    binding.queuedRevisions.set(item.id, result.status);
    binding.selected?.delete(item.id);
    if (result.evidence) showEvidence(result.evidence);
    lastMessage = item.id + " · " + result.message;
    if (result.status !== "written") break;
    previousPlans.push({...plan, after});
  }
  await refreshWordList();
  binding.queuedRevisions = null;
  message(lastMessage);
}

byId("write-selected").addEventListener("click", () => run(() =>
  writeSelected(binding.items.filter(item => binding.selected?.has(item.id)))));
</script>
