name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 只取消同一 PR 上过时的运行；推送到 main 的每次运行都保留
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 单元测试与服务安全自检（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 统一验证入口：完整单元 + 服务安全自检，留下结构化记录与原始日志。
      # 退出码语义与直接跑 python3 -m unittest discover tests / serve.py check 一致。
      - name: 单元测试与服务安全自检（统一验证入口）
        run: |
          # 验证记录与日志写在 .verify/（已忽略），CI 里作为构件上传；测试与自检都不碰真实台账。
          # job 级 env 不允许 runner 上下文，AE_HOME 用运行器的 RUNNER_TEMP 在脚本内展开。
          export AE_HOME="$RUNNER_TEMP/ae-home"
          python3 verify.py run --group unit --group serve-check --phase ci \
            --reason "CI ${{ github.event_name }} ${{ github.ref_name }} Python ${{ matrix.python-version }}"
      - name: 保存验证构件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-python${{ matrix.python-version }}
          path: .verify/
          # .verify 是点开头的目录，upload-artifact@v4 默认排除隐藏文件，必须显式包含
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      # 失败时也能看到提交、环境、通过 / 失败 / 跳过与日志定位
      - name: 验证摘要
        if: always()
        continue-on-error: true
        run: |
          echo "构件：verify-python${{ matrix.python-version }}（.verify/ 全部内容，含 record.json 与各组原始日志）"
          python3 verify.py report --latest | tee -a "$GITHUB_STEP_SUMMARY"
          python3 verify.py report --efficiency | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    # 固定名称（无 matrix）：便于 protect-main 规则集绑定单一 status check context。
    # 名称只涵盖 ruff check：格式检查（ruff format --check）待一次性格式化 PR 合并后
    # 在 cmd_lint_runner 的 steps 里追加，追加时无需改此名称，也就无需重新绑定。
    name: Lint 静态检查
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # lint 组经 uv tool run --from ruff==0.17.5 ruff check . 执行，uv 在此提供
      - uses: astral-sh/setup-uv@v5
      - name: Lint 静态检查（统一验证入口）
        run: |
          # 验证记录与日志写在 .verify/（已忽略），CI 里作为构件上传；lint 是纯逻辑组，不跑产品测试。
          # job 级 env 不允许 runner 上下文，AE_HOME 用运行器的 RUNNER_TEMP 在脚本内展开。
          export AE_HOME="$RUNNER_TEMP/ae-home"
          python3 verify.py run --group lint --phase ci \
            --reason "CI lint ${{ github.event_name }} ${{ github.ref_name }}"
      - name: 保存验证构件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 命名刻意避开 verify-python* 前缀：tools/collect_verify_history.py 只把
          # verify-python* 构件导入产品测试效率历史，lint 记录不是产品测试样本。
          name: verify-lint
          path: .verify/
          # .verify 是点开头的目录，upload-artifact@v4 默认排除隐藏文件，必须显式包含
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
