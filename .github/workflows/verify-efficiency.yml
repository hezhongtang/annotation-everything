name: Verification efficiency

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: verification-efficiency-history
  cancel-in-progress: false

jobs:
  summarize:
    name: 只读既有证据与增量回顾
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # 始终使用默认分支的受信任代码；不检出触发本工作流的 PR 代码。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 只读导入现有 CI 构件与合并 PR 事件
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/collect_verify_history.py --repo "$GITHUB_REPOSITORY" --out-dir .verify
      - name: 重建效率摘要（不运行产品测试）
        if: always()
        continue-on-error: true
        run: python3 verify.py report --efficiency --rebuild --events .verify/ci-events.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 保存有界回顾状态与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-efficiency-history
          path: |
            .verify/efficiency/
            .verify/ci-events.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
